name: Godot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Android command-line tools and SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          printf '4.7.2.stable\n' > "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt"

      - name: Validate project
        run: godot --headless --path . --editor --quit-after 2

      - name: Import resources
        run: godot --headless --path . --editor --quit-after 2

      - name: Export Android APK
        run: mkdir -p build && godot --headless --path . --export-debug Android build/HyoukaKartRacer-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyoukaKartRacer-APK
          path: build/HyoukaKartRacer-debug.apk
          if-no-files-found: error
